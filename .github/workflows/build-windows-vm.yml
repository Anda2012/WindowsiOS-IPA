
name: Build Windows 11 ARM64 VM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "=== Disk ==="
          df -h /
          echo "=== Memory ==="
          sysctl hw.memsize

      - name: Install dependencies
        run: |
          brew update
          brew install qemu wimlib pkg-config libslirp llvm meson ninja
          brew install aria2 cabextract cdrtools
          brew tap minacle/chntpw
          brew install minacle/chntpw/chntpw
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Download LLVM-MinGW
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "GitHub-Actions"}
          )
          data = json.load(urllib.request.urlopen(req))

          asset = next(
              a for a in data["assets"]
              if "macos-universal" in a["name"]
              and a["name"].endswith(".tar.xz")
          )

          print("Downloading:", asset["name"])
          urllib.request.urlretrieve(
              asset["browser_download_url"],
              "llvm-mingw.tar.xz"
          )
          PY

          mkdir llvm-mingw
          tar -xf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          echo "$PWD/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Prepare Windows optimizer
        run: |
          mkdir -p build
          aarch64-w64-mingw32-clang \
            -O2 -static -nostartfiles \
            -Wl,-e,mainCRTStartup \
            tools/opt_hive_arm64.c \
            -ladvapi32 \
            -o build/opt_hive_arm64.exe

      - name: Download and convert Windows 11 ARM64
        shell: bash
        run: |
          set -euo pipefail

          UUP_ID="11a79ad8-a26e-4deb-964e-f65231c110be"
          UUP_DIR="$PWD/uup-download"
          ISO_MOUNT="$PWD/work/iso"
          ISO_STAGE="$PWD/work/iso-stage"
          ESD_OUT="$PWD/work/downloads/Win11_24H2_ARM64_en-us.esd"

          mkdir -p "$UUP_DIR" work/downloads work

          echo "Downloading Windows 11 24H2 ARM64 Pro UUP package..."

          curl -fL --retry 3 \
            "https://uupdump.net/get.php?id=${UUP_ID}&pack=en-us&edition=professional&aria2=2" \
            -o uup-download.zip

          unzip -q uup-download.zip -d "$UUP_DIR"

          echo "Running UUP download and conversion..."

          cd "$UUP_DIR"
          chmod +x uup_download_macos.sh
          bash ./uup_download_macos.sh
          cd "$GITHUB_WORKSPACE"

          ISO="$(find "$UUP_DIR" -type f -iname '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: UUP converter did not produce an ISO."
            exit 1
          fi

          echo "Found ISO: $ISO"

          mkdir -p "$ISO_MOUNT" "$ISO_STAGE"

          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "$ISO_MOUNT" \
            "$ISO"

          trap 'hdiutil detach "$ISO_MOUNT" -quiet || true' EXIT

          echo "Creating combined ESD..."

          rsync -a \
            --exclude="/sources/install.esd" \
            --exclude="/sources/boot.wim" \
            "$ISO_MOUNT/" \
            "$ISO_STAGE/"

          # Index 1: Windows setup files
          wimlib-imagex capture \
            "$ISO_STAGE" \
            "$ESD_OUT" \
            "Windows Setup Files" \
            --compress=LZX

          # Index 2: Windows PE setup image
          wimlib-imagex export \
            "$ISO_MOUNT/sources/boot.wim" \
            2 \
            "$ESD_OUT" \
            "Windows Setup PE" \
            --compress=LZX \
            --boot

          # Indexes 3-6: Windows 11 Pro image.
          # Index 6 is retained because the existing provisioner expects it.
          for INDEX in 3 4 5 6; do
            echo "Adding Windows Pro image as index $INDEX..."

            wimlib-imagex export \
              "$ISO_MOUNT/sources/install.esd" \
              1 \
              "$ESD_OUT" \
              "Windows 11 Pro" \
              --compress=LZX
          done

          echo "Checking combined ESD..."
          wimlib-imagex info "$ESD_OUT"

          hdiutil detach "$ISO_MOUNT" -quiet
          trap - EXIT

          echo "Removing temporary UUP and ISO files..."
          rm -rf "$UUP_DIR" uup-download.zip "$ISO" "$ISO_STAGE"

          echo "Final ESD:"
          ls -lh "$ESD_OUT"

      - name: Build VM engine
        run: |
          make -j2 all
          ./build/hvsparse --help || true

      - name: Provision Windows
        run: |
          /opt/homebrew/bin/python3 scripts/provision_windows_arm64.py

      - name: Optimize Windows
        run: |
          /opt/homebrew/bin/python3 scripts/optimize_windows_lite.py

      - name: Pack VM image
        run: |
          ./build/hvsparse pack \
            work/windows11_lite.img \
            work/windows11.hvsparse

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          cp work/code.fd release-assets/
          cp work/vars_clean.fd release-assets/vars.fd

          split -b 1800m \
            work/windows11.hvsparse \
            release-assets/windows11.hvsparse.part-

          cat > release-assets/REASSEMBLE.txt <<'EOF'
          Join all windows11.hvsparse.part-* files in alphabetical order:

          cat windows11.hvsparse.part-* > windows11.hvsparse
          EOF

          df -h /
          du -sh release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Windows VM ${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
