
name: Build Windows 11 ARM64 VM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "=== Disk ==="
          df -h /
          echo "=== Memory ==="
          sysctl hw.memsize

      - name: Install dependencies
        run: |
          brew update
          brew install qemu wimlib pkg-config libslirp llvm meson ninja
          brew install aria2 cabextract cdrtools
          brew tap minacle/chntpw
          brew install minacle/chntpw/chntpw
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Download LLVM-MinGW
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "GitHub-Actions"}
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          assets = data.get("assets", [])
          asset = next(
              (
                  a for a in assets
                  if "macos-universal" in a["name"]
                  and a["name"].endswith(".tar.xz")
              ),
              None
          )

          if asset is None:
              raise SystemExit("Could not find the macOS LLVM-MinGW release.")

          print("Downloading:", asset["name"])
          urllib.request.urlretrieve(
              asset["browser_download_url"],
              "llvm-mingw.tar.xz"
          )
          PY

          mkdir llvm-mingw
          tar -xf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          echo "$PWD/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Prepare Windows optimizer
        run: |
          mkdir -p build

          aarch64-w64-mingw32-clang \
            -O2 -static -nostartfiles \
            -Wl,-e,mainCRTStartup \
            tools/opt_hive_arm64.c \
            -ladvapi32 \
            -o build/opt_hive_arm64.exe

      - name: Download and convert Windows 11 ARM64
        shell: bash
        run: |
          set -euo pipefail

          UUP_DIR="$PWD/uup-download"
          ISO_MOUNT="$PWD/work/iso"
          ISO_STAGE="$PWD/work/iso-stage"
          ESD_OUT="$PWD/work/downloads/Win11_24H2_ARM64_en-us.esd"

          mkdir -p "$UUP_DIR" work/downloads work

          # Find a Windows 11 24H2 ARM64 build.
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          import urllib.parse

          BASE = "https://api.uupdump.net/"

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Windows-VM-GitHub-Actions"}
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          url = BASE + "listid.php?" + urllib.parse.urlencode({
              "search": "26100",
              "sortByDate": "1"
          })

          data = get_json(url)
          result = data.get("response", {})

          if not isinstance(result, dict):
              raise SystemExit("UUP Dump returned an invalid response.")

          if result.get("error"):
              raise SystemExit("UUP Dump error: " + str(result["error"]))

          builds = result.get("builds", [])

          # Some API responses may expose builds as a dictionary.
          if isinstance(builds, dict):
              builds = list(builds.values())

          if not isinstance(builds, list):
              raise SystemExit(
                  "Unexpected UUP Dump builds format: "
                  + type(builds).__name__
              )

          candidates = []

          for item in builds:
              # Normal documented format: each build is an object.
              if isinstance(item, dict):
                  title = str(item.get("title", ""))
                  build = str(item.get("build", ""))
                  arch = str(item.get("arch", ""))
                  uuid = str(item.get("uuid", ""))
                  created = int(item.get("created") or 0)

              # If the API supplies UUID strings, retrieve their metadata.
              elif isinstance(item, str):
                  if not re.fullmatch(
                      r"[0-9a-fA-F-]{36}(?:_rev\.\d+)?",
                      item
                  ):
                      continue

                  info_url = BASE + "updateinfo.php?" + urllib.parse.urlencode({
                      "id": item
                  })

                  try:
                      info_data = get_json(info_url)
                      info = info_data.get("response", {})
                  except Exception:
                      continue

                  if not isinstance(info, dict):
                      continue

                  title = str(
                      info.get("title")
                      or info.get("updateTitle")
                      or info.get("updateName")
                      or ""
                  )
                  build = str(
                      info.get("build")
                      or info.get("foundBuild")
                      or ""
                  )
                  arch = str(info.get("arch", ""))
                  uuid = item
                  created = int(info.get("created") or 0)

              else:
                  continue

              if (
                  uuid
                  and arch.lower() in ("arm64", "aarch64")
                  and build.startswith("26100.")
                  and "windows 11" in title.lower()
              ):
                  candidates.append({
                      "title": title,
                      "build": build,
                      "arch": arch,
                      "uuid": uuid,
                      "created": created
                  })

          if not candidates:
              raise SystemExit(
                  "No Windows 11 26100 ARM64 builds were found. "
                  "UUP Dump returned "
                  + str(len(builds))
                  + " entries."
              )

          candidates.sort(
              key=lambda item: (
                  tuple(int(x) for x in item["build"].split(".")),
                  item["created"]
              ),
              reverse=True
          )

          selected = candidates[0]

          print("Selected Windows build:")
          print("Title:", selected["title"])
          print("Build:", selected["build"])
          print("Architecture:", selected["arch"])
          print("Update ID:", selected["uuid"])

          with open("uup-id.txt", "w") as file:
              file.write(selected["uuid"])
          PY

          UUP_ID="$(cat uup-id.txt)"

          # Request the UUP Dump conversion package.
          PACKAGE_URL="https://uupdump.net/get.php?id=${UUP_ID}&pack=en-us&edition=professional&aria2=2"

          echo "Downloading UUP package: $UUP_ID"

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            -A "Mozilla/5.0" \
            "$PACKAGE_URL" \
            -o uup-download.zip

          # Confirm that the server returned an actual ZIP.
          if ! unzip -tq uup-download.zip; then
            echo "::error::UUP Dump did not return a valid ZIP archive."
            echo "Downloaded file information:"
            file uup-download.zip
            echo "First 1000 bytes:"
            head -c 1000 uup-download.zip || true
            exit 1
          fi

          unzip -q uup-download.zip -d "$UUP_DIR"

          DOWNLOAD_SCRIPT="$UUP_DIR/uup_download_macos.sh"

          if [ ! -f "$DOWNLOAD_SCRIPT" ]; then
            echo "::error::The macOS UUP download script is missing."
            find "$UUP_DIR" -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$DOWNLOAD_SCRIPT"

          echo "Downloading UUP files and converting to ISO..."

          cd "$UUP_DIR"
          bash ./uup_download_macos.sh
          cd "$GITHUB_WORKSPACE"

          ISO="$(find "$UUP_DIR" -type f -iname '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "::error::UUP conversion did not produce an ISO."
            find "$UUP_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "ISO found: $ISO"

          mkdir -p "$ISO_MOUNT" "$ISO_STAGE"

          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "$ISO_MOUNT" \
            "$ISO"

          trap 'hdiutil detach "$ISO_MOUNT" -quiet || true' EXIT

          # Find the Windows installation image.
          INSTALL_IMAGE=""

          if [ -f "$ISO_MOUNT/sources/install.esd" ]; then
            INSTALL_IMAGE="$ISO_MOUNT/sources/install.esd"
          elif [ -f "$ISO_MOUNT/sources/install.wim" ]; then
            INSTALL_IMAGE="$ISO_MOUNT/sources/install.wim"
          else
            echo "::error::Neither install.esd nor install.wim exists in the ISO."
            ls -lah "$ISO_MOUNT/sources"
            exit 1
          fi

          if [ ! -f "$ISO_MOUNT/sources/boot.wim" ]; then
            echo "::error::boot.wim is missing from the ISO."
            exit 1
          fi

          # Remove any previous output.
          rm -f "$ESD_OUT"

          # Copy the setup files, excluding the large WIM images.
          rsync -a \
            --exclude="/sources/install.esd" \
            --exclude="/sources/install.wim" \
            --exclude="/sources/boot.wim" \
            "$ISO_MOUNT/" \
            "$ISO_STAGE/"

          # Index 1: Windows setup files.
          wimlib-imagex capture \
            "$ISO_STAGE" \
            "$ESD_OUT" \
            "Windows Setup Files" \
            --compress=LZX

          # Index 2: Windows Setup PE.
          wimlib-imagex export \
            "$ISO_MOUNT/sources/boot.wim" \
            2 \
            "$ESD_OUT" \
            "Windows Setup PE" \
            --compress=LZX \
            --boot

          # Put Windows Pro at index 6 to match the existing provisioner.
          # The selected UUP package is for the Professional edition.
          for INDEX in 3 4 5 6; do
            echo "Creating ESD index $INDEX..."

            wimlib-imagex export \
              "$INSTALL_IMAGE" \
              1 \
              "$ESD_OUT" \
              "Windows 11 Pro" \
              --compress=LZX
          done

          echo "Checking generated ESD..."
          wimlib-imagex info "$ESD_OUT"

          hdiutil detach "$ISO_MOUNT" -quiet
          trap - EXIT

          rm -rf "$UUP_DIR" uup-download.zip "$ISO" "$ISO_STAGE"
          rm -f uup-id.txt

          echo "Generated ESD:"
          ls -lh "$ESD_OUT"

      - name: Build VM engine
        run: |
          make -j2 all
          ./build/hvsparse --help || true

      - name: Provision Windows
        run: |
          /opt/homebrew/bin/python3 scripts/provision_windows_arm64.py

      - name: Optimize Windows
        run: |
          /opt/homebrew/bin/python3 scripts/optimize_windows_lite.py

      - name: Pack VM image
        run: |
          ./build/hvsparse pack \
            work/windows11_lite.img \
            work/windows11.hvsparse

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          cp work/code.fd release-assets/
          cp work/vars_clean.fd release-assets/vars.fd

          split -b 1800m \
            work/windows11.hvsparse \
            release-assets/windows11.hvsparse.part-

          cat > release-assets/REASSEMBLE.txt <<'EOF'
          Join all windows11.hvsparse.part-* files in alphabetical order:

          cat windows11.hvsparse.part-* > windows11.hvsparse
          EOF

          df -h /
          du -sh release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Windows VM ${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
