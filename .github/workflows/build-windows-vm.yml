
name: Build Windows 11 ARM64 VM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "=== Disk ==="
          df -h /
          echo "=== Memory ==="
          sysctl hw.memsize

      - name: Install dependencies
        run: |
          brew update
          brew install qemu wimlib pkg-config libslirp llvm meson ninja
          brew install aria2 cabextract cdrtools
          brew tap minacle/chntpw
          brew install minacle/chntpw/chntpw
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Download LLVM-MinGW
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "GitHub-Actions"}
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              data = json.load(response)

          asset = next(
              (
                  a for a in data.get("assets", [])
                  if "macos-universal" in a["name"]
                  and a["name"].endswith(".tar.xz")
              ),
              None
          )

          if asset is None:
              raise SystemExit("Could not find macOS LLVM-MinGW.")

          print("Downloading:", asset["name"])

          urllib.request.urlretrieve(
              asset["browser_download_url"],
              "llvm-mingw.tar.xz"
          )
          PY

          mkdir -p llvm-mingw
          tar -xf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          echo "$PWD/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Prepare Windows optimizer
        run: |
          mkdir -p build

          aarch64-w64-mingw32-clang \
            -O2 -static -nostartfiles \
            -Wl,-e,mainCRTStartup \
            tools/opt_hive_arm64.c \
            -ladvapi32 \
            -o build/opt_hive_arm64.exe

      - name: Download Windows 11 ARM64 UUP files
        shell: bash
        run: |
          set -euo pipefail

          UUP_ID="68ea9468-877e-4113-9f76-eebdb7604a81"

          mkdir -p uup-download/UUPs

          echo "Selected Windows 11 24H2 ARM64 Retail build."
          echo "UUP ID: $UUP_ID"

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            -A "Mozilla/5.0" \
            "https://uupdump.net/get.php?id=${UUP_ID}&pack=en-us&edition=professional&aria2=2" \
            -o uup-download/uup-files.txt

          if ! grep -qE '^https?://' uup-download/uup-files.txt; then
            echo "::error::UUP Dump did not return an aria2 download list."
            echo "UUP Dump response:"
            head -c 2000 uup-download/uup-files.txt
            exit 1
          fi

          echo "Download list received:"
          head -20 uup-download/uup-files.txt

          echo "Downloading Windows UUP files..."

          aria2c \
            --no-conf \
            --console-log-level=warn \
            --log-level=info \
            --max-tries=5 \
            --retry-wait=10 \
            --connect-timeout=30 \
            -x8 \
            -s8 \
            -j4 \
            -c \
            -d "$PWD/uup-download/UUPs" \
            -i "$PWD/uup-download/uup-files.txt"

          echo "UUP download completed."
          du -sh uup-download/UUPs

      - name: Convert UUP files to Windows ISO
        shell: bash
        run: |
          set -euo pipefail

          CONVERTER="$PWD/uup-converter"
          UUPS="$PWD/uup-download/UUPs"

          echo "Downloading official UUP converter..."

          git clone --depth 1 \
            https://git.uupdump.net/uup-dump/converter.git \
            "$CONVERTER"

          chmod +x "$CONVERTER/convert.sh"

          echo "Converting UUP files..."

          cd "$CONVERTER"
          ./convert.sh esd "$UUPS"
          cd "$GITHUB_WORKSPACE"

          ISO="$(find "$CONVERTER" "$UUPS" \
            -type f -iname '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "::error::UUP converter did not produce an ISO."
            find "$CONVERTER" "$UUPS" -maxdepth 4 -type f
            exit 1
          fi

          echo "Generated ISO: $ISO"
          echo "$ISO" > iso-path.txt

      - name: Assemble Windows ESD
        shell: bash
        run: |
          set -euo pipefail

          ISO="$(cat iso-path.txt)"
          ISO_MOUNT="$PWD/work/iso"
          ISO_STAGE="$PWD/work/iso-stage"
          ESD_OUT="$PWD/work/downloads/Win11_24H2_ARM64_en-us.esd"

          mkdir -p "$ISO_MOUNT" "$ISO_STAGE" work/downloads

          hdiutil attach \
            -readonly \
            -nobrowse \
            -mountpoint "$ISO_MOUNT" \
            "$ISO"

          trap 'hdiutil detach "$ISO_MOUNT" -quiet || true' EXIT

          if [ -f "$ISO_MOUNT/sources/install.esd" ]; then
            INSTALL_IMAGE="$ISO_MOUNT/sources/install.esd"
          elif [ -f "$ISO_MOUNT/sources/install.wim" ]; then
            INSTALL_IMAGE="$ISO_MOUNT/sources/install.wim"
          else
            echo "::error::No install.esd or install.wim found."
            ls -lah "$ISO_MOUNT/sources"
            exit 1
          fi

          if [ ! -f "$ISO_MOUNT/sources/boot.wim" ]; then
            echo "::error::boot.wim not found."
            exit 1
          fi

          echo "Checking Windows editions..."

          wimlib-imagex info "$INSTALL_IMAGE" --xml > install-info.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("install-info.xml").getroot()
          selected = None

          for image in root.findall("IMAGE"):
              index = image.attrib.get("INDEX")
              windows = image.find("WINDOWS")

              if windows is None:
                  continue

              edition = windows.findtext("EDITIONID", default="")

              print("Index:", index, "Edition:", edition)

              if edition.strip().lower() == "professional":
                  selected = index
                  break

          if selected is None:
              raise SystemExit("Windows Professional edition not found.")

          print("Professional edition index:", selected)

          with open("pro-index.txt", "w") as f:
              f.write(selected)
          PY

          PRO_INDEX="$(cat pro-index.txt)"

          rm -f "$ESD_OUT"

          rsync -a \
            --exclude="/sources/install.esd" \
            --exclude="/sources/install.wim" \
            --exclude="/sources/boot.wim" \
            "$ISO_MOUNT/" \
            "$ISO_STAGE/"

          wimlib-imagex capture \
            "$ISO_STAGE" \
            "$ESD_OUT" \
            "Windows Setup Files" \
            --compress=LZX

          wimlib-imagex export \
            "$ISO_MOUNT/sources/boot.wim" \
            2 \
            "$ESD_OUT" \
            "Windows Setup PE" \
            --compress=LZX \
            --boot

          wimlib-imagex export \
            "$INSTALL_IMAGE" \
            "$PRO_INDEX" \
            "$ESD_OUT" \
            "Windows 11 Pro" \
            --compress=LZX

          echo "Checking generated ESD:"
          wimlib-imagex info "$ESD_OUT"

          hdiutil detach "$ISO_MOUNT" -quiet
          trap - EXIT

          echo "ESD generated:"
          ls -lh "$ESD_OUT"

      - name: Align provisioning script with ESD indexes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/provision_windows_arm64.py")
          content = path.read_text()

          old = 'ESD, "6", wim_root / "sources" / "install.wim"'
          new = 'ESD, "3", wim_root / "sources" / "install.wim"'

          if old not in content:
              raise SystemExit(
                  "Could not find the expected Windows Pro export command."
              )

          path.write_text(content.replace(old, new, 1))

          print("Provisioner updated to use ESD index 3.")
          PY

      - name: Build VM engine
        run: |
          make -j2 all
          ./build/hvsparse --help || true

      - name: Provision Windows
        run: |
          /opt/homebrew/bin/python3 scripts/provision_windows_arm64.py

      - name: Optimize Windows
        run: |
          /opt/homebrew/bin/python3 scripts/optimize_windows_lite.py

      - name: Pack VM image
        run: |
          ./build/hvsparse pack \
            work/windows11_lite.img \
            work/windows11.hvsparse

      - name: Prepare release assets
        run: |
          set -euo pipefail

          mkdir -p release-assets

          cp work/code.fd release-assets/
          cp work/vars_clean.fd release-assets/vars.fd

          split -b 1800m \
            work/windows11.hvsparse \
            release-assets/windows11.hvsparse.part-

          cat > release-assets/REASSEMBLE.txt <<'EOF'
          Join all windows11.hvsparse.part-* files in alphabetical order:

          cat windows11.hvsparse.part-* > windows11.hvsparse
          EOF

          echo "=== Disk ==="
          df -h /

          echo "=== Release assets ==="
          du -sh release-assets
          ls -lh release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Windows VM ${{ inputs.version }}
          generate_release_notes: true
          files: release-assets/*
